name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux lts
            os: ubuntu-latest
            version: lts
          - name: Linux exact
            os: ubuntu-latest
            version: "22.23.2"
          - name: Linux line
            os: ubuntu-latest
            version: "24"
          - name: Linux arm64 current
            os: ubuntu-24.04-arm
            version: current
          - name: macOS arm64 lts
            os: macos-15
            version: lts
          - name: macOS x64 exact
            os: macos-15-intel
            version: "24.19.0"
          - name: Windows lts
            os: windows-latest
            version: lts
          - name: Windows exact
            os: windows-latest
            version: "22.23.2"
          - name: Windows arm64 line
            os: windows-11-arm
            version: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache-key: ${{ matrix.name }}

      - name: Assert output
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          test -n "$EXPECTED_VERSION" || { echo "node-version output is empty"; exit 1; }
          test "$(node --version)" = "v$EXPECTED_VERSION" || { echo "node --version mismatch"; exit 1; }
          test -n "$NODE_DIR" || { echo "NODE_DIR not exported"; exit 1; }
          echo "outputs ok: node-version=$EXPECTED_VERSION node-root=${{ steps.setup.outputs.node-root }}"

      - name: Smoke app
        shell: bash
        run: |
          cd .fixtures/hello
          npm --version >/dev/null
          node index.js

      - name: Run twice (cache restore path)
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache-key: ${{ matrix.name }}
        continue-on-error: true